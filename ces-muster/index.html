<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ces-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CES Muster</title>
    <link rel="stylesheet" href="/ces-ui.css" />
    <script>
      // Restore saved theme before first paint (same contract as ces-theme-toggle.js).
      // S1.2 (doc 26 A1): light first, like the Aavya mockups; a stored 'dark' still wins.
      // (Was dark by default — founder, 2026-09-07; change back here if BHD prefers.)
      (function () {
        var t = null;
        try { t = localStorage.getItem('ces-theme'); } catch (e) {}
        if (t === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
