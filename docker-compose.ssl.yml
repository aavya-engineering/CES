# Optional Compose override to run Nginx TLS reverse proxy inside Docker with ZeroSSL
# Usage:
#   1. Put your ZeroSSL certificates in ./certs/ :
#        - zerossl_bundle.crt (cat certificate.crt ca_bundle.crt > certs/zerossl_bundle.crt)
#        - private.key
#        - ca_bundle.crt
#   2. Run:
#        docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d --build

services:
  web:
    # Don't expose port 8080 publicly when using the internal SSL reverse proxy
    ports: !reset []

  nginx-ssl:
    image: nginx:1.27-alpine
    container_name: ces-nginx-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-zerossl-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/ssl/ces:ro
    depends_on:
      - web
    networks:
      - ces-internal
