name: CI

# G6 safety net: run the full CES suite (1008 tests incl. the G3 golden SSP
# reference) on every push/PR. Offline only — no live-tenant, network, or mmdc
# steps (those stay manual). Reproduces the root `npm test` contract exactly.

on:
  push:
    branches: [master, g0-safety-net]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + full suite
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: muster_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # matches local dev (v24.x); engines require >=18
          cache: 'npm'

      - name: Install (clean, from lockfile)
        run: npm ci

      # ces-tenant is linked as file:../ces-tenant by stamper/eo/ao/muster-api but
      # is not a workspace, so `npm ci` neither installs nor builds it. Without
      # dist/ the stamper build fails on "Cannot find module 'ces-tenant'"
      # (same order the Dockerfile uses). 2026-10-29.
      - name: Build ces-tenant (linked dependency)
        run: cd ces-tenant && npm ci && npm run build

      # Supply-chain gate (G-ENG-3): fail the build on a HIGH/CRITICAL production
      # vulnerability. This is the recurrence guard for G-ENG-2 (the multer HIGH):
      # a future high-severity prod dep cannot ship unnoticed. `high` level lets the
      # deferred, non-applicable uuid MODERATE through (EO uses uuid.v4 only).
      # The gate reads .audit-allowlist.json: an accepted advisory needs a reason,
      # an owner and an expiry date, and fails the build again once it expires.
      - name: Dependency audit (prod, high+, allowlisted exceptions expire)
        run: node scripts/audit-gate.mjs --level high

      # `npm test` runs the root contract: pretest builds ces-shared + ces-stamper,
      # then test:shared/stamper/eo/ao/fe (mixed vitest + jest). The eo suite
      # includes the golden SSP reference test. A failing test exits non-zero and
      # fails the job.
      - name: Build + test (full aggregate)
        run: npm test

      # Muster platform (not a root workspace — own lockfiles): the portal SPA and
      # muster-api, typecheck + unit suites. Added 2026-11-11; until then the
      # lifecycle platform was never exercised by CI.
      - name: Muster portal — install, typecheck, test
        run: cd ces-muster && npm ci && npx tsc --noEmit -p tsconfig.json && npm test
      - name: muster-api — install, generate Prisma client, typecheck, test
        # No DATABASE_URL here on purpose: the unit suites run on the in-memory mock, and tests/rls.test.ts
        # (live RLS, describe.skipIf(!DATABASE_URL)) must not run against the not-yet-migrated service DB.
        run: cd ces-muster/muster-api && npm ci && npx prisma generate && npx tsc --noEmit -p tsconfig.json && npm test
        env:
          JWT_SECRET: ci-only-not-a-secret

      # Real-database smoke (2026-11-11): migrations 001–023, the least-privilege
      # app role (RLS, no BYPASSRLS), then one write per lifecycle slice through
      # the HTTP app as the portal does. The unit suites run on an in-memory mock
      # and cannot see unknown columns, enum drift or client path bugs.
      - name: muster-api — migrate, bootstrap app role, Postgres smoke
        run: |
          cd ces-muster/muster-api
          npx prisma migrate deploy
          psql "postgresql://postgres:ci@localhost:5432/muster_db" -v ON_ERROR_STOP=1 -v app_password="'ci-app'" -f scripts/bootstrap-app-role.sql
          DATABASE_URL="postgresql://muster_app:ci-app@localhost:5432/muster_db" npx tsx scripts/smoke-postgres.ts
        env:
          JWT_SECRET: ci-only-not-a-secret
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/muster_db

      # MG-04 parity harness: regenerate Planner goldens for the scrubbed fixture(s)
      # headlessly and fail on any byte difference from the committed goldens.
      # A Planner change that alters plan output must update the goldens in the
      # same PR (npm run golden:generate -w ces-planner), so the change is reviewable.
      - name: Planner golden check (MG-04)
        run: npm run golden:check -w ces-planner
