# ====================================================================
# CES Platform — Host Nginx Reverse Proxy with ZeroSSL
# File location on host: /etc/nginx/sites-available/ces.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/ces.conf /etc/nginx/sites-enabled/
# ====================================================================

# Upstream pointer to CES Web container (published on 127.0.0.1:8080)
upstream ces_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --------------------------------------------------------------------
# 1. HTTP Server — Redirects to HTTPS & handles ZeroSSL ACME verification
# --------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 136.108.118.191.sslip.io *.136.108.118.191.sslip.io 136.108.118.191;

    # ZeroSSL Web Dashboard HTTP File Validation (/.well-known/pki-validation/<authfile>.txt)
    location /.well-known/pki-validation/ {
        root /var/www/zerossl;
        try_files $uri =404;
    }

    # ZeroSSL ACME HTTP-01 challenge directory (if using Certbot / automated renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------
# 2. HTTPS Server — ZeroSSL TLS Termination and Reverse Proxy
# --------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 136.108.118.191.sslip.io *.136.108.118.191.sslip.io 136.108.118.191;

    # ================================================================
    # ZeroSSL Certificate Configuration
    # NOTE: In ZeroSSL, certificate.crt and ca_bundle.crt MUST be concatenated:
    #   cat certificate.crt ca_bundle.crt > /etc/ssl/ces/zerossl_bundle.crt
    # ================================================================
    ssl_certificate         /etc/ssl/ces/zerossl_bundle.crt;
    ssl_certificate_key     /etc/ssl/ces/private.key;
    ssl_trusted_certificate /etc/ssl/ces/ca_bundle.crt;

    # TLS Protocols & High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling for ZeroSSL
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # Security Headers (Defense-in-depth for CMMC / sensitive compliance data)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max body size for evidence uploads (documents, scans, bundles)
    client_max_body_size 50M;

    # Access and Error Logs
    access_log /var/log/nginx/ces_access.log;
    error_log  /var/log/nginx/ces_error.log warn;

    # Reverse Proxy to the CES Docker Web Service
    location / {
        proxy_pass http://ces_backend;
        proxy_http_version 1.1;

        # WebSocket support (for live updates & sessions)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for longer compliance evaluations & migrations
        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
