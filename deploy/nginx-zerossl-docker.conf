# ====================================================================
# CES Platform — Dockerized Nginx Reverse Proxy with ZeroSSL
# Used when running Nginx inside Docker (docker-compose.ssl.yml)
# ====================================================================

upstream ces_web {
    server ces-web:80;
    keepalive 32;
}

# 1. HTTP Server — ACME Challenge & HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name 136.108.118.191.sslip.io *.136.108.118.191.sslip.io 136.108.118.191;

    location /.well-known/pki-validation/ {
        root /var/www/zerossl;
        try_files $uri =404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — ZeroSSL Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 136.108.118.191.sslip.io *.136.108.118.191.sslip.io 136.108.118.191;

    # ZeroSSL Certificates mounted into /etc/ssl/ces/
    ssl_certificate         /etc/ssl/ces/zerossl_bundle.crt;
    ssl_certificate_key     /etc/ssl/ces/private.key;
    ssl_trusted_certificate /etc/ssl/ces/ca_bundle.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://ces_web;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
